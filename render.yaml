services:
  - type: web
    name: voicesafe-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18

  - type: worker
    name: voicesafe-worker
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node worker.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18